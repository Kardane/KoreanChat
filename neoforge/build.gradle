plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "KoreanChat-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        koreanchat {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.java.srcDir '../src/main/java'
sourceSets.main.java.include 'org/karn/koreanchat/neoforge/**',
    'org/karn/koreanchat/util/ChatConversion.java',
    'org/karn/koreanchat/util/KoreanConvertorUtil.java'

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', project.mod_version
    inputs.property 'neo_version', project.neo_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand mod_version: project.mod_version, neo_version: project.neo_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
